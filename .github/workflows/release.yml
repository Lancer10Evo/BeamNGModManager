name: Build, Test & Auto-Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Single-File EXE
        run: dotnet publish -c Release -r win-x64 --self-contained true

      - name: Run Security & Lexer/AST Self-Test Suite
        shell: pwsh
        run: |
          .\bin\Release\net8.0-windows\win-x64\publish\BeamNGModManager.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Security self-tests failed!" }

      - name: Read Version and Compute SHA-256
        id: meta
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content .\BeamNGModManager.csproj
          $ver = $csproj.Project.PropertyGroup.Version | Select-Object -First 1
          $hash = (Get-FileHash .\bin\Release\net8.0-windows\win-x64\publish\BeamNGModManager.exe -Algorithm SHA256).Hash
          Write-Output "version=v$ver" >> $env:GITHUB_OUTPUT
          Write-Output "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Create or Update GitHub Release with SHA-256
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: "BeamModManager Ultimate ${{ steps.meta.outputs.version }}"
          body: |
            ### BeamModManager Ultimate ${{ steps.meta.outputs.version }}
            - **File:** `BeamNGModManager.exe` (Portable Single-File x64)
            - **SHA-256 Checksum:** `${{ steps.meta.outputs.sha256 }}`
            - **CI Security Self-Tests:** Passed (Lexer, Deobfuscator, AST Alias/Indexing, Benign Script Check)
          generate_release_notes: true
          files: bin/Release/net8.0-windows/win-x64/publish/BeamNGModManager.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
